<!DOCTYPE html>
<!-- Regression harness for js/kk-bean.js. Not linked from the site.
     Serve the repo root and open /tools/probe-bean.html.
     It mounts the SHIPPED file at chosen widths and asserts against the pixels:
     boot geometry, the N=0 silhouette, the reduced-motion board, and the
     accessibility wiring. The board boots with render(0) synchronously, so every
     check here holds even in a background tab where rAF is throttled. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>kk-bean probe</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
  body{ background:var(--paper-50); margin:0; padding:16px; }
  #out{ font:12px "Space Mono", monospace; white-space:pre; color:#0C1016; }
  .host{ position:absolute; left:-10000px; top:0; }
</style>
</head>
<body>
<div id="out">running…</div>
<div id="stage"></div>

<script src="/js/kk-bean.js"></script>
<script>
(function () {
  var L = [];
  function say(k, v, ok) { L.push((ok === undefined ? '   ' : (ok ? ' ok ' : 'FAIL')) + ' ' + k + ' = ' + v); }

  var realMM = window.matchMedia;
  function mount(width, reduced) {
    // stub matchMedia so mount() takes the branch we want
    window.matchMedia = function (q) {
      if (/prefers-reduced-motion/.test(q)) {
        return { matches: !!reduced, media: q,
                 addEventListener: function () {}, removeEventListener: function () {},
                 addListener: function () {}, removeListener: function () {} };
      }
      return realMM ? realMM.call(window, q) : { matches: false, media: q };
    };
    var host = document.createElement('div');
    host.className = 'host';
    host.style.width = width + 'px';
    document.getElementById('stage').appendChild(host);
    window.KK_BEAN.mount(host);
    window.matchMedia = realMM;
    return host;
  }

  function px(ctx, x, y) {
    var d = ctx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
    return { r: d[0], g: d[1], b: d[2], a: d[3] };
  }
  function painted(p) { return p.a > 8; }

  // The vertical budget from kk-bean.js render(), restated. These used to be
  // hardcoded pixels -- 366 for the plot floor, 126 for MAXH, scan windows of
  // 232..366 -- and every one of them had to be re-tuned by hand each time the
  // layout moved, which is a probe that costs more than it catches. Deriving
  // them still asserts something real: that what the renderer PUTS on the canvas
  // agrees with the geometry the file documents. If the two drift, this fails.
  function geom(H, small) {
    var HEAD_ROWS = 1, DIAG_ROWS = small ? 2 : 1, READ_TOP = 62;
    var HEAD_LEAD = small ? 17 : 20, DIAG_LEAD = small ? 15 : 17;
    var FOOT = READ_TOP + HEAD_ROWS * HEAD_LEAD + (DIAG_ROWS - 1) * DIAG_LEAD + 10;
    var BASE = H - FOOT, yTop = 24;
    var MAXH = Math.round((BASE - yTop) * 0.373);
    return { BASE: BASE, MAXH: MAXH, top: BASE - MAXH,
             brackY: BASE + 30 + 12, readY: BASE + READ_TOP };
  }
  var G = geom(440, false);          // both desktop mounts
  var scanTop = G.top - 14;          // a little above the tallest a bar can be

  // ---- A. desktop, not reduced, first synchronous frame ----
  var hA = mount(1092, false);
  var cA = hA.querySelector('canvas');
  var xA = cA.getContext('2d');
  var dpr = Math.min(2, window.devicePixelRatio || 1);

  say('A canvas css height', cA.style.height, cA.style.height === '440px');
  say('A backing store', cA.width + 'x' + cA.height,
      cA.width === Math.round(1092 * dpr) && cA.height === Math.round(440 * dpr));
  say('A css width', cA.style.width, cA.style.width === '100%');
  say('A role', cA.getAttribute('role'), cA.getAttribute('role') === 'img');
  say('A tabindex', cA.tabIndex, cA.tabIndex === 0);
  var alA = cA.getAttribute('aria-label') || '';
  say('A aria-label len', alA.length, alA.length > 80);
  say('A aria says 0 days', /\b0 days\b/.test(alA), /\b0 days\b/.test(alA));
  say('A aria says nothing landed', /Nothing has landed/.test(alA), /Nothing has landed/.test(alA));

  // Only bins 3..22 are drawn -- exactly -4 to +4 sigma -- so at this width the
  // chart runs 106..986 and the old far-left sample at x=25 is now off the chart
  // entirely, where nothing is ever painted. edgeX sits inside bin 3, the
  // leftmost DRAWN bin, where the implied curve is a small fraction of a pixel
  // tall and the first paint going down is the axis rule itself.
  var cx = Math.round(1092 / 2);
  var probeX = cx + 10;   // inside bin 13 -- same height as the mode
  var edgeX = cx - 400;   // inside bin 3, the left end of the drawn window
  // The implied line's own hairline is centred on BASE out here, so it straddles
  // the axis rule -- hence the +/-1. Stops short of the readout, which now sits
  // below the axis and would otherwise be the first thing a downward scan hit.
  var baseFound = -1, y;
  for (y = 300; y < G.BASE + 6; y++) {
    if (painted(px(xA, edgeX, y))) { baseFound = y; break; }
  }
  say('A plot floor y', baseFound + ' (BASE ' + G.BASE + ')',
      baseFound >= G.BASE - 1 && baseFound <= G.BASE + 1);

  // the implied silhouette must be drawn with ZERO days on the board
  var peak = -1;
  for (y = scanTop; y < G.BASE; y++) {
    if (painted(px(xA, probeX, y))) { peak = y; break; }
  }
  say('A silhouette top at N=0', peak + ' (plot top ' + G.top + ')',
      peak >= G.top - 4 && peak <= G.top + 2);
  say('A silhouette fills MAXH', (G.BASE - peak) + 'px of ' + G.MAXH,
      Math.abs((G.BASE - peak) - G.MAXH) <= 4);

  // ---- B. phone width ----
  var hB = mount(360, false);
  var cB = hB.querySelector('canvas');
  say('B canvas css height', cB.style.height, cB.style.height === '330px');
  var wB = cB.getBoundingClientRect().width;
  say('B rendered width', wB.toFixed(1) + ' (host 360)', wB <= 360.5);
  say('B backing store w', cB.width, cB.width === Math.round(360 * dpr));

  // ---- C. reduced motion ----
  var hC = mount(1092, true);
  var cC = hC.querySelector('canvas');
  var xC = cC.getContext('2d');
  var rateC = hC.querySelectorAll('input[type=range]')[1];
  say('C rate slider disabled', rateC.disabled, rateC.disabled === true);
  var alC = cC.getAttribute('aria-label') || '';
  // One bead is one DAY -- it takes R moves through the session and closes once
  // -- so N counts days directly and months are days/30. instantDrops(2400) is
  // therefore 2,400 days and 80 months. Both are asserted: the readout has been
  // wrong about this pair before, in both directions, and the description is the
  // only place the units are stated in words.
  var dC = alC.match(/([\d,]+) days/);
  say('C aria days', dC ? dC[1] : '(none)', !!dC && dC[1] === '2,400');
  var mC = alC.match(/([\d,]+) months/);
  say('C aria months', mC ? mC[1] : '(none)', !!mC && mC[1] === '80');
  say('C aria has measured', /Measured mean/.test(alC), /Measured mean/.test(alC));
  // A filled board: the TALLEST bar reaches MAXH. Sampling one bin would not do
  // -- bars are scaled against the realised maximum, and in 2,400 draws the bin
  // nearest the mean is not reliably the fullest one.
  var barTop = 999, xs, yy;
  for (xs = cx - 120; xs <= cx + 120; xs += 5) {
    for (yy = scanTop; yy < G.BASE; yy++) {
      if (painted(px(xC, xs, yy))) { if (yy < barTop) { barTop = yy; } break; }
    }
  }
  say('C tallest bar top', barTop + ' (plot top ' + G.top + ')',
      barTop >= G.top - 4 && barTop <= G.top + 2);
  // and the pile is where a fair coin puts it, not shoved to one side
  var lo = 0, hi = 0;
  for (y = scanTop; y < G.BASE; y++) {
    if (painted(px(xC, cx - 300, y))) { lo = G.BASE - y; break; }
  }
  for (y = scanTop; y < G.BASE; y++) {
    if (painted(px(xC, cx + 300, y))) { hi = G.BASE - y; break; }
  }
  say('C symmetric at +/-300px', lo + ' vs ' + hi, Math.abs(lo - hi) <= 6);

  // ---- C2. the tail label text clears WCAG AA on paper ----
  // Sampled from the pixels, not from the token: a fill that never reaches the
  // canvas is not a colour anyone has to read. Fully-covered glyph pixels carry
  // the fill exactly, so take the most opaque one in the left label's band.
  function lin(c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function lum(p) { return 0.2126 * lin(p.r) + 0.7152 * lin(p.g) + 0.0722 * lin(p.b); }
  var paperL = lum({ r: 0xFB, g: 0xF9, b: 0xF2 });
  // The bracket label starts at the chart's left edge (106 at this width), not
  // at the canvas padding, and its baseline follows BASE down. Both were fixed
  // pixels here and both had drifted off the glyphs.
  var best = null, xx;
  for (xx = 108; xx < 280; xx++) {
    for (yy = G.brackY - 12; yy <= G.brackY + 2; yy++) {
      var q = px(xC, xx, yy);
      if (q.a >= 250 && (!best || lum(q) < lum(best))) { best = q; }
    }
  }
  if (best) {
    var tl = lum(best);
    var cr = (Math.max(tl, paperL) + 0.05) / (Math.min(tl, paperL) + 0.05);
    say('C2 tail label rgb', best.r + ',' + best.g + ',' + best.b,
        best.r === 94 && best.g === 117 && best.b === 7);
    say('C2 tail label contrast', cr.toFixed(2) + ':1 (AA needs 4.5)', cr >= 4.5);
  } else {
    say('C2 tail label sampled', 'no opaque glyph pixel found', false);
  }

  // ---- C3. non-text contrast: tail bars and the axis (WCAG 1.4.11, 3:1) ----
  // The canvas is transparent where nothing is drawn, and the bars are painted
  // at alpha < 1, so a raw pixel is not the colour a visitor sees. Composite
  // each sample over paper-50 first — that is what is actually on screen.
  function overPaper(p) {
    var a = p.a / 255;
    return { r: p.r * a + 0xFB * (1 - a),
             g: p.g * a + 0xF9 * (1 - a),
             b: p.b * a + 0xF2 * (1 - a) };
  }
  function ratio(c) {
    var l = lum(c);
    return (Math.max(l, paperL) + 0.05) / (Math.min(l, paperL) + 0.05);
  }
  // The tail bar fill, in the LEFT TAIL band (left of -2 sigma), asked for BY
  // NAME rather than by opacity. Bars are opaque now, and so is the paper casing
  // the implied line carries where it crosses one, so "the most opaque pixel in
  // the band" returns the CASING -- paper over paper, 1.00:1 -- and reports a
  // compliant chart as failing. Matching lime-800 exactly proves both that the
  // tail bars are drawn in it and that it is what actually reaches the screen.
  // 110..326 is the left tail band as it is now drawn: from the window's left
  // edge (bin 3) to the -2 sigma line at binX(7.5). It used to start at 30,
  // which is off the chart since the window narrowed to +/-4 sigma.
  var tailPx = null, tx, ty2;
  for (tx = 110; tx < 326 && !tailPx; tx += 2) {
    for (ty2 = scanTop; ty2 < G.BASE; ty2++) {
      var q2 = px(xC, tx, ty2);
      if (q2.a > 250 && q2.r === 0x5E && q2.g === 0x75 && q2.b === 0x07) { tailPx = q2; break; }
    }
  }
  if (tailPx) {
    var tc = ratio(overPaper(tailPx));
    say('C3 tail bar is lime-800', tailPx.r + ',' + tailPx.g + ',' + tailPx.b, true);
    say('C3 tail bar contrast', tc.toFixed(2) + ':1 (1.4.11 needs 3)', tc >= 3);
  } else {
    say('C3 tail bar sampled', 'no lime-800 tail bar pixel found', false);
  }

  // ---- C4. the implied outline is drawn ON TOP of the bars ----
  // The defect the whole rework turns on. band() used to paint the reference
  // first and the bars second, so the one layer the chart exists to compare was
  // occluded in exactly the places where a comparison was possible -- and at
  // 0.15 alpha it was 1.38:1 against paper even where nothing covered it.
  // Push P(up move) well away from the settled pile so the model is FORCED to
  // cross the interior of a tall bar, then look for its paper casing inside that
  // bar. Ink on ink would be invisible; casing on ink is proof it is on top.
  var pC = hC.querySelectorAll('input[type=range]')[0];
  pC.value = '600';
  pC.dispatchEvent(new Event('input', { bubbles: true }));
  //
  // Asserted as CONTRAST, not as "is it paper". The casing is a 3.4px stroke
  // under a 1.6px ink core, so the paper-only part is well under a pixel on each
  // side and antialiases against the ink bar beneath it -- it lands around
  // rgb(191,190,186), never the flat rgb(251,249,242) an equality test expects.
  // An earlier version of this check looked for pure paper and reported "not
  // found" on a line that was plainly on screen at 10:1. What the chart owes is
  // that the line reads where it crosses a bar, so measure that.
  var colX = cx + 10, barY = -1, lightest = null, yq, qq;
  for (yq = scanTop; yq < G.BASE; yq++) {
    qq = px(xC, colX, yq);
    if (barY < 0) { if (painted(qq)) { barY = yq; } continue; }
    // strictly inside the bar, clear of its own top edge
    if (yq > barY + 3 && qq.a > 250 && (!lightest || lum(qq) > lum(lightest))) { lightest = qq; }
  }
  say('C4 bar top found', barY, barY > scanTop && barY < G.BASE);
  if (lightest) {
    var inkL = lum({ r: 0x0C, g: 0x10, b: 0x16 });
    var lc = (Math.max(lum(lightest), inkL) + 0.05) / (Math.min(lum(lightest), inkL) + 0.05);
    say('C4 model line over the bar',
        lightest.r + ',' + lightest.g + ',' + lightest.b + ' = ' + lc.toFixed(1) + ':1 vs fill',
        lc >= 3);
  } else {
    say('C4 model line over the bar', 'nothing lighter than the fill inside it', false);
  }
  // The axis rule, sampled at the left END OF THE DRAWN WINDOW where no bar or
  // implied line overlaps it. x=25 was off the chart once the window narrowed to
  // +/-4 sigma, so this reported "no axis pixel" rather than a bad contrast --
  // a check that had stopped looking at anything.
  var axPx = null, ay;
  for (ay = G.BASE - 3; ay <= G.BASE + 3; ay++) {
    var q3 = px(xC, edgeX, ay);
    if (q3.a > 120 && (!axPx || q3.a > axPx.a)) { axPx = q3; }
  }
  if (axPx) {
    var ac = ratio(overPaper(axPx));
    say('C3 axis contrast', ac.toFixed(2) + ':1 (1.4.11 needs 3)', ac >= 3);
  } else {
    say('C3 axis sampled', 'no axis pixel found', false);
  }

  // ---- D. labels wired to controls ----
  var labs = hA.querySelectorAll('label');
  var ins = hA.querySelectorAll('input[type=range]');
  say('D label count', labs.length, labs.length === 2);
  say('D label0 -> input0', labs[0].htmlFor === ins[0].id && !!ins[0].id,
      labs[0].htmlFor === ins[0].id && !!ins[0].id);
  say('D label1 -> input1', labs[1].htmlFor === ins[1].id && !!ins[1].id,
      labs[1].htmlFor === ins[1].id && !!ins[1].id);
  say('D unique ids across mounts', ins[0].id + ' vs ' + hB.querySelectorAll('input')[0].id,
      ins[0].id !== hB.querySelectorAll('input')[0].id);
  say('D valuetext', ins[0].getAttribute('aria-valuetext'),
      ins[0].getAttribute('aria-valuetext') === '0.500');
  var btn = hA.querySelector('button');
  say('D clear btn height', btn.getBoundingClientRect().height.toFixed(1),
      btn.getBoundingClientRect().height >= 24);

  // ---- E. keyboard drop path exists ----
  var before = (cA.getAttribute('aria-label').match(/([\d,]+) days/) || [])[1];
  var ev = new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
  cA.dispatchEvent(ev);
  say('E keydown was consumed', ev.defaultPrevented, ev.defaultPrevented === true);

  // ---- F. live region populates ----
  window.setTimeout(function () {
    var srA = hA.querySelector('p[role=status]');
    say('F live region filled', (srA.textContent || '').length, (srA.textContent || '').length > 80);
    say('F live region offscreen', srA.getBoundingClientRect().width.toFixed(0) + 'px',
        srA.getBoundingClientRect().width < 2);
    var fails = 0, i;
    for (i = 0; i < L.length; i++) { if (L[i].indexOf('FAIL') === 0) { fails++; } }
    document.getElementById('out').textContent =
      L.join('\n') + '\n\n' + (fails ? fails + ' FAILED' : 'ALL PASS') + ' (' + L.length + ' checks)';
  }, 800);
})();
</script>
</body>
</html>
