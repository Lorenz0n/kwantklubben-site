<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">

<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta name="theme-color" content="#FBF9F2">

<!-- Sharing. Without these a link to the site posts as a bare grey URL — no
     image, no title, no description — and a LinkedIn post or a QR poster is how
     most people meet the klub first. og:image must be an absolute URL: the
     crawler fetching it is not on the site. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kwant Klubben">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="{{ site.url }}/assets/og-card.png">

<!-- HEAD-COMMON -->
<!-- Shared by every page — this file is the only copy.
     Chewy is NOT optional: the footer wordmark is set in it at 37vw with a
     -3.3vw nudge tuned to its metrics, and check-site.py fails the build if it
     is dropped from this URL. -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/favicon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Chewy&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/styles.css">
<script>document.documentElement.classList.add('js')</script>
<!-- /HEAD-COMMON -->
</head>
<body>

<!-- NAV -->
<!-- Shared by every page — this file is the only copy.
     aria-current is set by js/kk-nav.js rather than hardcoded here.
     The `hidden` attribute on the panel is load-bearing: kk-nav.js is deferred,
     so without it the drawer renders OPEN on a cold mobile cache until the
     script lands. check-site.py asserts it. Do not switch to a class.
     Contact is a button rather than a page: there is nothing a contact page
     would hold that this mailto does not. -->
<a class="kk-skip" href="#main">Skip to content</a>
<header class="kk-nav">
  <div class="kk-nav__inner">
    <a class="kk-nav__logo" href="/"><img src="/assets/logo-primary.png" alt="Kwant Klubben — home" width="1020" height="592"></a>
    <nav class="kk-nav__links" aria-label="Main">
      <div class="kk-nav__panel" id="kk-nav-panel" hidden>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/partners/">Partners</a>
      </div>
      <a class="kk-btn kk-btn--secondary kk-btn--sm" href="mailto:hello@kwantklubben.com">Contact</a>
      <a class="kk-btn kk-btn--primary kk-btn--sm" href="https://forms.gle/P5Aw4ka85QUZiUmZ9" target="_blank" rel="noopener">Join the klub</a>
      <button class="kk-nav__toggle" type="button" aria-label="Menu" aria-controls="kk-nav-panel" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </div>
</header>
<!-- /NAV -->

<main id="main">
{{ content }}
</main>

<!-- FOOTER -->
<!-- Shared by every page — this file is the only copy.
     No class on the <footer> element: the mobile override that undoes the
     wordmark overlay is `footer{display:block}`, and any class selector here
     would out-specify it. That is exactly how 38a783c broke the phone layout. -->
<footer>
  <div class="kk-footer__inner">
    <div class="kk-footer__brand">
      <img src="/assets/logo-mark-knockout.png" alt="" width="512" height="512">
      <span>Kwant Klubben · Independent student club at the University of Southern Denmark</span>
    </div>
    <div class="kk-footer__links">
      <a href="mailto:hello@kwantklubben.com">hello@kwantklubben.com</a>
      <a href="https://www.linkedin.com/company/kwant-klubben" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
  <!-- Ornamental only: 37vw, 14% opacity, and deliberately clipped so a quarter
       of the letterforms bleed off the page. As real text it was announced as a
       stray "KWANT" after the footer content on every page. -->
  <div class="kk-footer-word" aria-hidden="true"><span>KWANT</span></div>
</footer>
<!-- /FOOTER -->

<!-- SCRIPTS -->
<!-- kk-motion.js used to load here for the footer wordmark's scroll reveal.
     The wordmark is static now and nothing else on the site used it, so it was
     a request per page that did nothing. kk-bean.js returns immediately where
     there is no #kk-bean, which is why it can sit in the shared block. -->
<script src="/js/kk-nav.js" defer></script>
<script src="/js/kk-bean.js" defer></script>
<!-- /SCRIPTS -->
</body>
</html>
