name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shared blocks and site invariants
        run: python tools/check-site.py
